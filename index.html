<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Hub</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#17243b;margin:0}header{background:#142b4b;color:white;padding:24px}main{max-width:1150px;margin:auto;padding:24px}.panel{background:white;border:1px solid #e1e6ee;border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{background:#fff;border-radius:14px;padding:20px;border:1px solid #e1e6ee}.stat b{font-size:28px;display:block}input,textarea,select,button{font:inherit;box-sizing:border-box}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:5px 0 12px}label{font-size:13px;font-weight:650}button{background:#174b83;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;margin:4px}button.secondary{background:#e8edf4;color:#183553}button.danger{background:#b42318}textarea{min-height:100px}h2{margin-top:0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.listing{border:1px solid #e1e6ee;border-radius:14px;overflow:hidden;background:white}.listing img{width:100%;height:160px;object-fit:cover}.listing .info{padding:14px}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;background:#e9f3ed;color:#166534;border-radius:30px;padding:4px 9px;font-size:12px}.hidden{display:none}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{height:85px;width:100px;object-fit:cover;border-radius:8px}#editor{scroll-margin-top:10px}a{color:#175aa0}small{color:#64748b}@media(max-width:600px){main{padding:12px}header{padding:16px}}</style></head><body><header><h1>🏙️ Property Hub</h1><div>จัดการ Listing จาก Facebook • ค้นหา • เก็บรูป • ส่งออกข้อมูล</div></header><section class="panel" style="max-width:1110px;margin:24px auto"><p id="connectionMessage" role="status">กำลังเชื่อมต่อ…</p></section><main id="app"><fieldset id="workspace" disabled style="border:0;padding:0;margin:0;min-width:0"><section class="grid" id="stats"></section><section class="panel"><h2>นำเข้าประกาศ Facebook</h2><label>ลิงก์โพสต์ Facebook</label><input id="link" placeholder="https://www.facebook.com/..." type="url"><label>ข้อความประกาศ (คัดลอกจากโพสต์)</label><textarea id="raw" placeholder="วางข้อความประกาศที่นี่ ระบบจะช่วยแยกราคา ขนาดห้อง เบอร์โทร และวันพร้อมเข้าอยู่"></textarea><button onclick="parsePost()">✨ แยกข้อมูลจากข้อความ</button><p class="muted">Facebook อาจป้องกันการอ่านโพสต์โดยอัตโนมัติ แอพนี้จึงไม่ดึงข้อมูลจากลิงก์โดยตรง กรุณาวางข้อความและแนบรูปเอง</p></section><section class="panel" id="editor"><h2 id="formTitle">เพิ่ม / แก้ไข Listing</h2><div class="grid" id="fields"></div><label>รายละเอียดเพิ่มเติม</label><textarea id="notes"></textarea><label>รูปภาพห้อง (เลือกได้หลายรูป)</label><input id="photos" type="file" accept="image/*" multiple><div id="preview" class="thumbs"></div><button onclick="save()">💾 บันทึก Listing</button><button class="secondary" onclick="resetForm()">ล้างฟอร์ม</button><p id="message" class="muted"></p></section><section class="panel"><h2>รายการอสังหาริมทรัพย์</h2><div class="grid"><input id="search" placeholder="ค้นหาชื่อโครงการ ทำเล เบอร์โทร..." oninput="render()"><select id="filter" onchange="render()"><option value="">ทุกสถานะ</option><option>พร้อมเข้าอยู่</option><option>รอเข้าอยู่</option><option>รอติดต่อ</option><option>ปล่อยแล้ว</option></select><input id="max" type="number" placeholder="งบสูงสุด (บาท/เดือน)" oninput="render()"></div><button onclick="exportCSV()">⬇ Export CSV (เปิดใน Excel)</button><button class="secondary" onclick="backup()">⬇ Backup JSON + รูป</button><label style="display:inline-block;margin-left:8px">Restore JSON<input type="file" accept="application/json" onchange="restore(event)"></label><div class="cards" id="cards"></div></section></fieldset></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="cloud.js"></script><script>
const defs=[['project','ชื่อโครงการ'],['location','ทำเล / ถนน / BTS'],['type','ประเภท (คอนโด/บ้าน)'],['rent','ราคาเช่า / เดือน','number'],['sale','ราคาขาย','number'],['size','ขนาดห้อง (ตร.ม.)','number'],['beds','ห้องนอน'],['baths','ห้องน้ำ'],['floor','ชั้น'],['available','วันพร้อมเข้าอยู่','date'],['received','วันที่ได้ Listing','date'],['contact','ชื่อผู้ติดต่อ'],['phone','เบอร์โทร'],['line','LINE ID'],['source','แหล่งที่มา (Owner/Agent/Co-Agent)'],['status','สถานะ']];let records=[],editing=null,existingPhotos=[];const $=id=>document.getElementById(id);function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function init(){ $('fields').innerHTML=defs.map(([k,l,t])=>`<div><label for="f_${k}">${l}</label>${k==='status'?`<select id="f_${k}"><option>รอติดต่อ</option><option>พร้อมเข้าอยู่</option><option>รอเข้าอยู่</option><option>ปล่อยแล้ว</option></select>`:k==='source'?`<select id="f_${k}"><option>ไม่ระบุ</option><option>Owner</option><option>Agent</option><option>Co-Agent</option></select>`:`<input id="f_${k}" type="${t||'text'}">`}</div>`).join('');resetForm();render()}function resetForm(){editing=null;existingPhotos=[];defs.forEach(([k])=>{$('f_'+k).value=''});$('f_received').value=new Date().toLocaleDateString('en-CA');$('f_status').value='รอติดต่อ';$('notes').value='';$('photos').value='';$('link').value='';$('raw').value='';$('preview').innerHTML='';$('formTitle').textContent='เพิ่ม / แก้ไข Listing';$('message').textContent=''}function parsePost(){let t=$('raw').value;if(!t.trim()){alert('กรุณาวางข้อความโพสต์ก่อน');return}let p=(t.match(/(?:โครงการ|คอนโด|หมู่บ้าน)\s*[:：-]?\s*([^\n,]{3,65})/i)||[])[1];if(p)$('f_project').value=p.trim();let rent=t.match(/(?:ค่าเช่า|เช่า|rent|ราคาเช่า)\s*[:：]?\s*([\d,]+)\s*(?:บาท|฿|THB)?/i);if(rent)$('f_rent').value=rent[1].replaceAll(',','');let sale=t.match(/(?:ราคาขาย|ขาย|sale)\s*[:：]?\s*([\d,]+)\s*(?:บาท|฿|THB)?/i);if(sale)$('f_sale').value=sale[1].replaceAll(',','');let size=t.match(/(\d+(?:\.\d+)?)\s*(?:ตร\.?ม\.?|sqm|sq\.?m)/i);if(size)$('f_size').value=size[1];let bed=t.match(/(\d+)\s*(?:ห้องนอน|bedroom|bed)/i);if(bed)$('f_beds').value=bed[1];let bath=t.match(/(\d+)\s*(?:ห้องน้ำ|bathroom|bath)/i);if(bath)$('f_baths').value=bath[1];let phone=t.match(/(?:0\d[\d\s-]{7,12}\d)/);if(phone)$('f_phone').value=phone[0].trim();let line=t.match(/(?:line\s*(?:id)?|ไลน์)\s*[:：]?\s*(@?[a-zA-Z0-9_.-]+)/i);if(line)$('f_line').value=line[1];$('notes').value=t;$('message').textContent='แยกข้อมูลเบื้องต้นแล้ว กรุณาตรวจสอบและเติมข้อมูลที่ขาดก่อนบันทึก';$('editor').scrollIntoView({behavior:'smooth'})}function filesToData(files){return Promise.all([...files].map(f=>new Promise((res,rej)=>{let reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(f)})))}let saving=false;async function save(){if(saving)return;saving=true;try{let obj={};defs.forEach(([k])=>obj[k]=$('f_'+k).value);obj.link=$('link').value;obj.notes=$('notes').value;if(!obj.project&&!obj.location){alert('กรุณาระบุชื่อโครงการหรือทำเล');return}const files=[...$('photos').files];if(files.some(f=>f.size>5*1024*1024)||files.length+existingPhotos.length>20)throw Error('แนบรูปได้ไม่เกิน 20 รูป ขนาดไม่เกินรูปละ 5 MB');obj.photos=[...existingPhotos,...await filesToData(files)];obj.id=editing||crypto.randomUUID();await cloud.save(obj);if(editing)records=records.map(r=>r.id===editing?obj:r);else records.unshift(obj);resetForm();render();window.scrollTo({top:0,behavior:'smooth'})}catch(e){$('message').textContent='บันทึกไม่สำเร็จ: '+e.message}finally{saving=false}}function edit(id){let r=records.find(x=>x.id===id);if(!r)return;editing=id;defs.forEach(([k])=>{$('f_'+k).value=r[k]||''});$('link').value=r.link||'';$('notes').value=r.notes||'';existingPhotos=r.photos||[];$('preview').innerHTML=existingPhotos.map((p,i)=>`<div><img src="${p}"><button class="danger" onclick="removePhoto(${i})">ลบรูป</button></div>`).join('');$('formTitle').textContent='แก้ไข Listing';$('editor').scrollIntoView({behavior:'smooth'})}function removePhoto(i){existingPhotos.splice(i,1);$('preview').innerHTML=existingPhotos.map((p,j)=>`<div><img src="${p}"><button class="danger" onclick="removePhoto(${j})">ลบรูป</button></div>`).join('')}async function del(id){if(!confirm('ลบ Listing นี้?'))return;try{await cloud.remove(id);records=records.filter(r=>r.id!==id);render()}catch(e){alert('ลบไม่สำเร็จ: '+e.message)}}function render(){let n=records.length;let stats=[['Listings ทั้งหมด',n],['พร้อมเข้าอยู่',records.filter(r=>r.status==='พร้อมเข้าอยู่').length],['รอติดต่อ',records.filter(r=>r.status==='รอติดต่อ').length],['ปล่อยแล้ว',records.filter(r=>r.status==='ปล่อยแล้ว').length]];$('stats').innerHTML=stats.map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join('');let q=$('search').value.toLowerCase(),status=$('filter').value,max=Number($('max').value);let list=records.filter(r=>(!status||r.status===status)&&(!max||Number(r.rent)<=max&&Number(r.rent)>0)&&[r.project,r.location,r.contact,r.phone,r.notes].join(' ').toLowerCase().includes(q));$('cards').innerHTML=list.map(r=>`<article class="listing">${r.photos?.length?`<img src="${r.photos[0]}" alt="รูปอสังหาริมทรัพย์">`:'<div style="height:160px;background:#e9eef5;display:grid;place-items:center">🏠 ไม่มีรูป</div>'}<div class="info"><b>${escapeHTML(r.project||'ไม่ระบุโครงการ')}</b><div class="muted">${escapeHTML(r.location||'')}</div><h2>${r.rent?Number(r.rent).toLocaleString()+' ฿/เดือน':'ไม่ระบุราคา'}</h2><div>${escapeHTML(r.beds||'-')} ห้องนอน · ${escapeHTML(r.size||'-')} ตร.ม.</div><p><span class="pill">${escapeHTML(r.status||'')}</span> <small>${escapeHTML(r.source||'')}</small></p><div class="muted">รับ Listing: ${escapeHTML(r.received||'-')}<br>เข้าอยู่: ${escapeHTML(r.available||'-')}<br>ติดต่อ: ${escapeHTML(r.contact||'-')} ${escapeHTML(r.phone||'')}</div>${r.link?`<p><a href="${/^https?:\/\//i.test(r.link)?escapeHTML(r.link):'#'}" target="_blank" rel="noopener noreferrer">เปิดโพสต์ต้นทาง</a></p>`:''}<button onclick="edit('${r.id}')">ดู / แก้ไข / รูป</button><button class="danger" onclick="del('${r.id}')">ลบ</button></div></article>`).join('')||'<p class="muted">ยังไม่มี Listing ที่ตรงกับตัวกรอง</p>'}function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportCSV(){let keys=['project','location','type','rent','sale','size','beds','baths','floor','available','received','contact','phone','line','source','status','link','notes'];let csv='\ufeff'+[keys.join(','),...records.map(r=>keys.map(k=>'"'+String(r[k]||'').replaceAll('"','""')+'"').join(','))].join('\r\n');download('property-listings.csv',csv,'text/csv;charset=utf-8')}function backup(){download('property-hub-backup.json',JSON.stringify(records),'application/json')}async function restore(ev){let f=ev.target.files[0];if(!f)return;try{const data=cloud.validate(JSON.parse(await f.text()));if(!confirm('นำเข้าข้อมูลจาก Backup และแทนที่รายการปัจจุบัน?'))return;await cloud.restore(data);records=data;resetForm();render()}catch(e){alert('นำเข้าไม่สำเร็จ: '+e.message)}finally{ev.target.value=''}}cloud.boot();</script></body></html>
